<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="OWL — a fully working retro QWERTY phone simulator. Boot the phone, browse, play games, all offline in your browser." />
    <link rel="icon" type="image/svg+xml" href="/owl.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>OWL — Retro QWERTY Phone Simulator</title>

    <!--
      Google Fonts is a nice-to-have: if the network stalls, the stylesheet must
      never hold up first paint. `media="print" + onload` makes it non-blocking,
      and every font-family has a local fallback in global.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Press+Start+2P&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Press+Start+2P&display=swap"
      />
    </noscript>

    <!-- Last-resort paint: a splash inside #root, replaced the instant React mounts. -->
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; color: #e8eef7; }
      body { overflow: hidden; }
      #root { min-height: 100%; }
      .owl-splash {
        position: fixed; inset: 0; display: grid; place-items: center; gap: 14px;
        align-content: center; background: radial-gradient(circle at 50% 38%, #16233a, #05070d 70%);
        font-family: 'Rajdhani', 'Inter', system-ui, sans-serif; text-align: center;
      }
      .owl-splash svg { width: 74px; height: 74px; filter: drop-shadow(0 0 22px rgba(246, 185, 63, 0.45)); }
      .owl-splash b { letter-spacing: 0.4em; font-size: 13px; font-weight: 700; color: #f6b93f; }
      .owl-splash i { font-style: normal; font-size: 11px; opacity: 0.65; letter-spacing: 0.12em; }
      .owl-splash .bar { width: 120px; height: 2px; background: rgba(246, 185, 63, 0.2); overflow: hidden; border-radius: 2px; }
      .owl-splash .bar u { display: block; width: 40%; height: 100%; background: #f6b93f; animation: owlSlide 1.1s ease-in-out infinite; }
      @keyframes owlSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .owl-splash .bar u { animation: none; width: 100%; } }
      .owl-fallback {
        position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center;
        font-family: system-ui, sans-serif; background: #05070d; color: #e8eef7;
      }
      .owl-fallback.on { display: grid; }
      .owl-fallback div { max-width: 460px; display: grid; gap: 10px; justify-items: center; }
      .owl-fallback h1 { font-size: 18px; margin: 0; letter-spacing: 0.06em; }
      .owl-fallback p { margin: 0; font-size: 13px; line-height: 1.6; opacity: 0.75; }
      .owl-fallback code { font-size: 11px; background: #101a2b; padding: 2px 5px; border-radius: 4px; }
      .owl-fallback button {
        margin-top: 4px; font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(246, 185, 63, 0.5); background: rgba(246, 185, 63, 0.12); color: #f6b93f;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="owl-splash" aria-label="OWL is starting">
        <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
          <path d="M17.6 21.4c-1.4-4.4-3.6-8-6.2-10.6 2.8-1.2 6.6-.4 9.6 1.6 2 1.3 3.6 3 4.8 5 1.4-3.6 3.4-5.7 6.2-6.4 3.6-1.4 7.6-1.2 10.6.6-2.4 2.6-4.4 6.2-5.8 10.4" fill="#c8d3e2" stroke="#0d1525" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M32 11c-9.6 0-16.4 6.1-17.8 14.6-.6 3.6-.2 7 .5 10.3 1.2 5.4 4.6 10.2 9.2 13.2 2.5 1.6 5.3 2.6 8.1 2.6s5.6-1 8.1-2.6c4.6-3 8-7.8 9.2-13.2.7-3.3 1.1-6.7.5-10.3C48.4 17.1 41.6 11 32 11Z" fill="#c8d3e2" />
          <circle cx="22" cy="29" r="10" fill="#0a1424" /><circle cx="42" cy="29" r="10" fill="#0a1424" />
          <circle cx="22" cy="29" r="7" fill="#f6b93f" /><circle cx="42" cy="29" r="7" fill="#f6b93f" />
          <circle cx="22" cy="29" r="3.6" fill="#08101e" /><circle cx="42" cy="29" r="3.6" fill="#08101e" />
          <circle cx="20.4" cy="27.4" r="1.4" fill="#fff" /><circle cx="40.4" cy="27.4" r="1.4" fill="#fff" />
          <path d="M32 35.5l5 4-5 4.4-5-4.4z" fill="#f6b93f" stroke="#5c3a04" stroke-width="1.2" stroke-linejoin="round" />
        </svg>
        <b>OWL</b>
        <div class="bar"><u></u></div>
        <i>Starting up…</i>
      </div>
    </div>

    <!--
      If the bundle never mounts (blocked script, dead chunk after a redeploy,
      ancient browser) this explains it instead of leaving a black screen.
      main.tsx removes it on mount; the timer arms it after 9 s.
    -->
    <div class="owl-fallback" id="owl-fallback" role="alert">
      <div>
        <h1>OWL could not start</h1>
        <p>
          The page loaded but the app script did not run. This is usually a stale
          cached bundle after an update, or a browser extension / network rule
          blocking <code>/assets/*.js</code>.
        </p>
        <p>Reloading with a fresh cache almost always fixes it.</p>
        <button type="button" onclick="location.reload()">Reload OWL</button>
      </div>
    </div>

    <script>
      // Arm the fallback only if React has not mounted within 9 seconds.
      window.__owlBooted = false;
      setTimeout(function () {
        if (!window.__owlBooted) {
          var el = document.getElementById('owl-fallback');
          if (el) el.className = 'owl-fallback on';
        }
      }, 9000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
