<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="OWL — a fully working retro QWERTY phone simulator. Boot the phone, browse, play games, all offline in your browser." />
    <link rel="icon" type="image/svg+xml" href="/owl.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>OWL — Retro QWERTY Phone Simulator</title>

    <!--
      Google Fonts is a nice-to-have: if the network stalls, the stylesheet must
      never hold up first paint. `media="print" + onload` makes it non-blocking,
      and every font-family has a local fallback in global.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Press+Start+2P&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Press+Start+2P&display=swap"
      />
    </noscript>

    <!-- Last-resort paint: a splash inside #root, replaced the instant React mounts. -->
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; color: #e8eef7; }
      body { overflow: hidden; }
      #root { min-height: 100%; }
      .owl-fallback {
        position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center;
        font-family: system-ui, sans-serif; background: #05070d; color: #e8eef7;
      }
      .owl-fallback.on { display: grid; }
      .owl-fallback div { max-width: 460px; display: grid; gap: 10px; justify-items: center; }
      .owl-fallback h1 { font-size: 18px; margin: 0; letter-spacing: 0.06em; }
      .owl-fallback p { margin: 0; font-size: 13px; line-height: 1.6; opacity: 0.75; }
      .owl-fallback code { font-size: 11px; background: #101a2b; padding: 2px 5px; border-radius: 4px; }
      .owl-fallback button {
        margin-top: 4px; font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(246, 185, 63, 0.5); background: rgba(246, 185, 63, 0.12); color: #f6b93f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      If the bundle never mounts (blocked script, dead chunk after a redeploy,
      ancient browser) this explains it instead of leaving a black screen.
      main.tsx removes it on mount; the timer arms it after 9 s.
    -->
    <div class="owl-fallback" id="owl-fallback" role="alert">
      <div>
        <h1>OWL could not start</h1>
        <p>
          The page loaded but the app script did not run. This is usually a stale
          cached bundle after an update, or a browser extension / network rule
          blocking <code>/assets/*.js</code>.
        </p>
        <p>Reloading with a fresh cache almost always fixes it.</p>
        <button type="button" onclick="location.reload()">Reload OWL</button>
      </div>
    </div>

    <script>
      // Arm the fallback only if React has not mounted within 9 seconds.
      window.__owlBooted = false;
      setTimeout(function () {
        if (!window.__owlBooted) {
          var el = document.getElementById('owl-fallback');
          if (el) el.className = 'owl-fallback on';
        }
      }, 9000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
